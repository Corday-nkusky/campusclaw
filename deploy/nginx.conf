# CampusClaw · Nginx 站点配置
#
# 职责有三，且**只有**这三件：
#   1. 托管前端静态资源（SPA，未知路径回落 index.html）；
#   2. 把 /api 与 /health 反代到 api 服务；
#   3. 不对外暴露上传目录。
#
# 为什么前端与 API 走同一个来源：token 经前端 JS 手工加到 Authorization 头，
# 同源反代让跨域与凭证特例都不存在（add-token-auth 后不再依赖 Cookie 属性），
# 只有同源请求才会被浏览器自动带上。前后端分域会让鉴权多出一整套 CORS +
# credentials 的特例，而生产环境本来就不需要（design.md 交付链路）。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ⚠️ 必须 ≥ 应用侧 MAX_UPLOAD_BYTES，否则 Nginx 会**先**返回 413，
    #    客户端收到的是 Nginx 的 HTML 错误页，而不是应用的
    #    {"error":"payload_too_large","limit_bytes":…}。
    #    Nginx 默认只有 1m，而应用默认允许 2MiB —— 不改这一行，
    #    1MiB~2MiB 之间的文件在应用看来「合法」却永远传不进来。
    #    这里给 4m，留出 multipart 边界与表单字段的余量。
    client_max_body_size 4m;

    # 不把 Nginx 版本号写在错误页与响应头里
    server_tokens off;

    # ── 安全响应头 ────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ── 压缩 ──────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # ── 上传目录绝不静态暴露（R5.2 的第二道口子）────────────
    # 应用侧根本没有 /uploads 路由，这里再显式堵一次：
    # 即使将来有人误把 uploads 挂进容器，也读不到。
    location /uploads/ {
        return 404;
    }

    # ── API 反代 ──────────────────────────────────────────────
    # proxy_pass 不带 URI 部分 → 原样透传路径，不做任何重写。
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # ⚠️ X-Forwarded-For 用**赋等**而不是 $proxy_add_x_forwarded_for。
        # 应用侧 clientIP() 无条件采信 XFF 的第一个值来做登录失败限流键，
        # 这是安全的**前提是** XFF 只能由我们自己的代理写入。
        # 若用 $proxy_add_x_forwarded_for（在客户端值后面追加），
        # 攻击者只要自带一个 XFF 头就能伪造 IP、绕过按 IP 的限流。
        # api 服务没有映射宿主端口，外部唯一入口就是这里，所以赋等是正确的。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        # 上传是长请求，别让代理过早掐断
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # /health 不查库，给编排与运维用；同样反代到应用而不是本地回 200 ——
    # 本地硬编码一个 200 会让「进程死了但 Nginx 活着」被误判成健康。
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 静态资源 ──────────────────────────────────────────────
    # ⚠️ Nginx 的 add_header 是**覆盖**而不是叠加：只要某个 location 里
    #    出现了一条 add_header，server 级的那三条安全头在这个 location 里
    #    就全部失效。所以下面每个写了 add_header 的 location 都把安全头重列一遍。
    #    （用 `always` 保证 4xx/5xx 响应也带上。）

    # Vite 产物带内容哈希，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    # index.html 必须不缓存，否则发版后用户拿到的是旧的入口
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # SPA 回落：/materials 这类前端路由在磁盘上没有对应文件
    location / {
        try_files $uri $uri/ /index.html;
    }
}
